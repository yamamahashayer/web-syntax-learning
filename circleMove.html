<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Move Circle</title>
    <style>
        #cont {
            width: 600px;
            height: 400px;
            border: solid rgb(42, 35, 172) 5px;
            position: relative; /* Ensures child position is relative to this container */
            overflow: hidden; /* Keeps the circle inside the container */
        }
        #movC {
            width: 50px;
            height: 50px;
            border-radius: 50%; /* Makes it a perfect circle */
            border: solid red 3px;
            background-color: rgb(209, 83, 83);
            position: absolute; /* Required for top and left positioning */
            top: 0;
            left: 0;
        }
    </style>
</head>
<body onmousemove="showCoord()">  

    <div id="cont">
        <div id="movC"></div>
    </div>
    <p id="showCoor"></p>

    <script>
        let cx = 0; // Horizontal position
        let cy = 0; // Vertical position
        const speed = 2; // Speed of movement

        // Function to update circle's position
        function movCircle() {
            let circle = document.getElementById('movC');
            cx += speed; // Increment horizontal position
            cy += speed; // Increment vertical position

            // Set the position of the circle
            circle.style.left = cx + 'px';
            circle.style.top = cy + 'px';

            // Stop movement if the circle reaches the edge of the container
            if (cx + 50 >= 600 || cy + 50 >= 400) {
                cx = 0;
                cy = 0;
            }

            requestAnimationFrame(movCircle); // Smooth animation
        }

        // Show mouse coordinates
        function showCoord(event) {
            let x = event.clientX;
            let y = event.clientY;
            document.getElementById("showCoor").innerText = `(${x}, ${y})`;
        }

        // Initialize when window loads
        window.onload = () => {
            movCircle();
        };
    </script>
</body>
</html>
