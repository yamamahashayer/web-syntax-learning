<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iframe Test Example</title>
</head>
<body>
    <h1>Embedding Content with Iframe</h1>

    <!-- Embedding a YouTube video -->
    <iframe src="https://www.youtube.com/embed/dQw4w9WgXcQ" width="560" height="315" title="YouTube video"></iframe>

    <h2>Embedded Webpage</h2>

    <!-- Embedding an external webpage -->
    <iframe src="https://www.example.com" width="800" height="600" title="Example Website"></iframe>

    <h2>Embedding a PDF</h2>

    <!-- Embedding a PDF document -->
    <iframe src="https://www.w3.org/WAI/WCAG21/quickref/files/accessible-pdf.pdf" width="600" height="400" title="Accessible PDF"></iframe>
    
    <h2>Using Sandbox Attribute</h2>

    <!-- Sandbox usage for extra security -->
    <iframe src="https://www.example.com" width="800" height="600" sandbox="allow-scripts" title="Sandboxed Example"></iframe>
</body>
</html>
