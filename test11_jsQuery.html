<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Form</title>
    <script>
        function saveToLs(){
            // let stName=document.getElementById("txtStName").value;
            // let stG=document.getElementsByName("rbGender")[0].value;
            // localStorage.setItem("stName",stName);
            // localStorage.setItem("stG",stG);
            let stName = document.getElementById("txtStName").value;
            let genders = document.getElementsByName("rbGender");
            let stGender = "";

            for (let i = 0; i < genders.length; i++) {
                if (genders[i].checked) {
                    stGender = genders[i].value; // Get the value of the selected radio button
                    break; // Exit the loop once the selected button is found
                }
            }
            
            // Save to localStorage
            localStorage.setItem("stName", stName);
            localStorage.setItem("stGender", stGender);





        }
        function save(){

            alert(window.location);


        }
    </script>
</head>
