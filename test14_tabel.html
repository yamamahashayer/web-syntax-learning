<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>/* تنسيق الجدول */
        table {
            border-collapse: collapse; /* دمج الحدود لتظهر بخط واحد */
            width: 50%; /* عرض الجدول */
            margin: 20px auto; /* توسيط الجدول */
            text-align: center; /* توسيط النصوص داخل الخلايا */
            font-family: Arial, sans-serif; /* خط النصوص */
        }
        
        /* تنسيق خلايا الجدول */
        td {
            border: 2px solid black; /* حدود سوداء حول كل خلية */
            padding: 10px; /* مسافة داخل الخلايا */
            font-size: 18px; /* حجم الخط */
        }
        
        /* إضافة لون خلفية لصفوف متناوبة */
        tr:nth-child(odd) {
            background-color: #f9f9f9; /* لون فاتح */
        }
        
        tr:nth-child(even) {
            background-color: #e9e9e9; /* لون أغمق قليلاً */
        }
        </style>
</head>
<body>
<table >
    <tr>
        <td>1</td>
        <td rowspan="3">2</td>
        <td>3</td>
    </tr>
    <tr>
        <td>4</td>
        <td rowspan="2">5</td>
    </tr>
    <tr><td>6</td></tr>
    <tr ><td colspan="3">7</td></tr>
</table>
<table>
    <tr><td>1</td><td>1</td></tr>
    <tr><td rowspan="2">2</td><td>2</td></tr>
    <tr><td colspan="3">3</td><td>3</td><td>3</td><td>3</td><td>3</td></tr>
    <tr><td rowspan="3">4</td><td rowspan="2">4</td><td>4</td></tr>
    <tr><td  colspan="3">5</td><td rowspan="2">5</td></tr>
    <tr><td colspan="3">6</td><td>6</td></tr>


</table>


</body>
</html>
