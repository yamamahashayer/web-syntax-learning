<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script> 
        function getQSData(){
            // Get the query string from the URL and split it by '&'
            let qs = window.location.search.substring(1).split('&');
            alert("Query String Array: " + qs);
            
            // Initialize an output string to store the key-value pairs
            let output = "";
            
            // Loop through each key-value pair in the query string
            for (let i = 0; i < qs.length; i++) {
                // Split the key-value pair by '='
                let pair = qs[i].split("=");
                
                // Decode and format the key and value
                let key = decodeURIComponent(pair[0]);
                let value = decodeURIComponent(pair[1] || "");
                
                // Append the key-value pair to the output string
                output += key + " : " + value + "<br>";
            }
            
            // Set the output string as the inner HTML of the qsData div
            document.getElementById("qsData").innerHTML = output;
        }

        }

    </script>
</head>
<body onload="getQSData()">

        <!-- Query string key-value pairs will be displayed here -->
    </div>
</body>
</html>
