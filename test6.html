<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details</title>
    
    <style>
        body {
            font-family: 'Pacifico', cursive;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            background-color: #2b2b2b; /* Darker background for better contrast */
            color: #f5f5f5; /* Light color for general text */
        }

        html {
            scroll-behavior: smooth;
        }

        h1, h2, h3 {
            color: #f4a261; /* Highlight color for headings */
        }

        h2:hover, p:hover {
            transform: scale(1.05);
            color: #f5a623;
            transition: transform 0.3s ease, color 0.3s ease;
        }

        hr {
            border: none;
            height: 2px;
            background: linear-gradient(to right, #c06c68, #f5a623, #c06c68);
            margin: 10px 0;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }

        .product-details {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            background-color: #3d0404;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }

        .product-details img {
            width: 50%; /* Adjusted width for smaller image */
            max-width: 300px; /* Reduced maximum width */
            border-radius: 10px;
            box-shadow: 0 5px 10px rgba(0, 0, 0, 0.3);
        }

        .product-details .info {
            text-align: center;
            margin-top: 20px;
        }

        .product-details .info h1 {
            font-size: 2rem;
            margin: 10px 0;
            color: #f5a623;
        }

        .product-details .info p {
            font-size: 1.1rem;
            color: #ddd;
            line-height: 1.6;
        }

        .product-details .price {
            font-size: 1.5rem;
            color: #e67e22;
            font-weight: bold;
            margin: 10px 0;
        }

        .product-details .description {
            font-size: 1rem;
            color: #ccc;
            margin: 15px 0;
            line-height: 1.5;
            max-width: 600px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: normal;
        }

        .product-details .buy-now {
            padding: 10px 20px;
            background-color: #e67e22;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
            margin-top: 20px;
            transition: background-color 0.3s, transform 0.3s;
        }

        .product-details .buy-now:hover {
            background-color: #f4a261;
            transform: scale(1.05);
        }

        .product-details .social-share {
            margin-top: 20px;
        }

        .product-details .social-share a {
            color: #f5a623;
            font-size: 1.5rem;
            margin: 0 10px;
            transition: color 0.3s;
        }

        .product-details .social-share a:hover {
            color: #f4ecee;
        }
    </style>
</head>
<body>
    <div class="product-details">
        <img src="css-assignment-5-8.png" alt="Product Image">
        <div class="info">
            <h1>Product Name</h1>
            <p>Short description of the product to entice potential customers.</p>
            <div class="price">$99.99</div>
            <p class="description">This is a detailed description of the product. It explains all the key features, specifications, and benefits to help customers make an informed decision.</p>
            <button class="buy-now">Buy Now</button>
        </div>
    </div>
</body>
</html>
