<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Inline Example</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>Welcome to JavaScript Basics!</h1>
    <p id="message1">Click the button to change this text.</p>
    <button onclick="document.getElementById('message1').textContent = 'You just changed the text using JavaScript!';">Click Me!</button>

    <h1>Change Text Color with JavaScript</h1>
    <p id="message2">Click the button to change my color.</p>
    <button onclick="document.getElementById('message2').style.color = 'blue';">Change Color</button>

    <h1>Change Background Color with JavaScript</h1>
    <p id="message3">Click the button to change my background color.</p>
    <button onclick="document.getElementById('message3').style.backgroundColor = 'yellow';">Change Background</button>


    <h1>change font </h1>
    <p id="message4">Click the button to change my font</p>
    <button onclick="document.getElementById('message4') .style.fontStyle = 'italic'"> Change fount</button>


</body>
</html>
